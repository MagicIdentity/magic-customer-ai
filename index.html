<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0F0A1A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Magic Ops">
  <meta name="description" content="Magic Operations — Internal CRM Intelligence & Campaign Management">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Magic Operations</title>

  <!-- WebDaemon — identity only (no backend agent) -->
  <link rel="webdaemon" href="agent.yml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">

  <!-- Import map for WebDaemon BrowserApp -->
  <script type='importmap'>
    {
      "imports": {
        "$static/": "https://webdaemon.online/dev/static/"
      }
    }
  </script>

  <style>
    :root {
      --bg-deep: #0F0A1A;
      --bg-surface: #1A1428;
      --bg-raised: #231C34;
      --bg-input: #2A2240;
      --accent: #8B5CF6;
      --accent-soft: #7C3AED;
      --accent-glow: rgba(139, 92, 246, 0.15);
      --accent-dim: rgba(139, 92, 246, 0.08);
      --campaign-accent: #fdc368;
      --campaign-glow: rgba(253, 195, 104, 0.18);
      --text-primary: #F0ECF7;
      --text-secondary: #9B8FBB;
      --text-tertiary: #6B5F85;
      --border: #2E2645;
      --border-light: #3A3155;
      --danger: #EF4444;
      --warning: #F59E0B;
      --success: #10B981;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;
      --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.1);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; overflow: hidden; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      height: 100%;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── SPLASH ── */
    #splash {
      position: fixed; inset: 0; z-index: 1000;
      background: var(--bg-deep);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-icon {
      width: 56px; height: 56px; border-radius: 16px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-soft) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin-bottom: 16px;
      animation: pulse-glow 2s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
      50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.5); }
    }
    .splash-text { color: var(--text-secondary); font-size: 14px; font-weight: 500; letter-spacing: 0.5px; }

    /* ── GATE SCREEN ── */
    #gateScreen {
      position: fixed; inset: 0; z-index: 900;
      background: var(--bg-deep);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    #gateScreen.visible { display: flex; }
    .gate-icon { font-size: 48px; margin-bottom: 20px; }
    .gate-title { font-size: 22px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); }
    .gate-subtitle { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 24px; max-width: 320px; }
    .gate-link {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent); color: white;
      padding: 12px 24px; border-radius: var(--radius-full);
      text-decoration: none; font-weight: 600; font-size: 14px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .gate-link:hover { transform: translateY(-1px); box-shadow: var(--shadow-glow); }

    /* ── APP SHELL ── */
    #app {
      display: none; flex-direction: column;
      height: 100%; height: 100dvh;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }
    #app.visible { display: flex; }

    /* ── HEADER ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      min-height: 56px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-logo {
      width: 32px; height: 32px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-soft) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .header-identity {
      font-size: 11px; color: var(--text-tertiary); font-weight: 400;
      max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── MODE TABS ── */
    .mode-tabs {
      display: flex; gap: 2px;
      background: var(--bg-deep);
      padding: 2px; border-radius: var(--radius-md);
    }
    .mode-tab {
      padding: 6px 14px; border-radius: 10px;
      font-size: 12px; font-weight: 600;
      color: var(--text-tertiary);
      cursor: pointer; border: none; background: transparent;
      transition: all 0.2s ease;
      white-space: nowrap;
      font-family: inherit;
    }
    .mode-tab:hover { color: var(--text-secondary); }
    .mode-tab.active {
      background: var(--accent-dim);
      color: var(--accent);
    }
    .mode-tab.active[data-mode="campaigns"] {
      background: var(--campaign-glow);
      color: var(--campaign-accent);
    }

    /* ── TOOLS NAV ── */
    .tools-bar {
      display: flex; gap: 6px;
      padding: 6px 16px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }
    .tools-bar::-webkit-scrollbar { display: none; }
    .tool-link {
      padding: 5px 12px; border-radius: var(--radius-full);
      font-size: 11px; font-weight: 500;
      color: var(--text-tertiary);
      background: var(--bg-raised);
      border: 1px solid var(--border);
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s;
      cursor: pointer;
    }
    .tool-link:hover { color: var(--text-secondary); border-color: var(--border-light); }
    .tool-link.active-tool {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    /* ── CHAT AREA ── */
    .chat-container {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 16px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      max-width: 720px; margin: 0 auto 16px;
      animation: msg-in 0.3s ease-out;
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-user {
      display: flex; justify-content: flex-end;
    }
    .msg-user .msg-bubble {
      background: var(--accent);
      color: white;
      padding: 10px 16px;
      border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
      max-width: 80%; font-size: 14px; line-height: 1.5;
      word-wrap: break-word;
    }

    .msg-assistant .msg-bubble {
      background: var(--bg-raised);
      color: var(--text-primary);
      padding: 14px 18px;
      border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg);
      border: 1px solid var(--border);
      font-size: 14px; line-height: 1.65;
      word-wrap: break-word;
    }
    .msg-assistant .msg-bubble p { margin-bottom: 10px; }
    .msg-assistant .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-assistant .msg-bubble strong { color: var(--accent); font-weight: 600; }
    .msg-assistant .msg-bubble code {
      background: var(--bg-deep); padding: 2px 6px; border-radius: 4px;
      font-size: 12px; color: var(--text-secondary);
    }
    .msg-assistant .msg-bubble ul, .msg-assistant .msg-bubble ol {
      margin: 8px 0; padding-left: 20px;
    }
    .msg-assistant .msg-bubble li { margin-bottom: 4px; }
    .msg-assistant .msg-bubble h3, .msg-assistant .msg-bubble h4 {
      margin: 14px 0 6px; color: var(--text-primary);
    }
    .msg-assistant .msg-bubble a {
      color: var(--accent); text-decoration: underline;
      text-underline-offset: 2px;
    }
    .msg-assistant .msg-bubble table {
      width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px;
    }
    .msg-assistant .msg-bubble th, .msg-assistant .msg-bubble td {
      padding: 6px 10px; border: 1px solid var(--border); text-align: left;
    }
    .msg-assistant .msg-bubble th {
      background: var(--bg-deep); font-weight: 600; color: var(--text-secondary);
    }

    /* Campaign mode accent override */
    .mode-campaigns .msg-assistant .msg-bubble strong { color: var(--campaign-accent); }
    .mode-campaigns .msg-user .msg-bubble { background: var(--campaign-accent); color: #1a1425; }
    .mode-campaigns .msg-assistant .msg-bubble a { color: var(--campaign-accent); }

    /* ── TYPING INDICATOR ── */
    .typing { display: flex; gap: 4px; padding: 16px 18px; }
    .typing-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-tertiary);
      animation: typing-bounce 1.4s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ── INPUT AREA ── */
    .input-area {
      padding: 10px 16px 12px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-row {
      display: flex; align-items: flex-end; gap: 8px;
      max-width: 720px; margin: 0 auto;
    }
    #userInput {
      flex: 1; resize: none; border: none; outline: none;
      background: var(--bg-input);
      color: var(--text-primary);
      padding: 11px 16px;
      border-radius: var(--radius-md);
      font-family: inherit; font-size: 14px;
      line-height: 1.5;
      max-height: 120px;
      border: 1px solid var(--border);
      transition: border-color 0.2s;
    }
    #userInput:focus { border-color: var(--accent); }
    #userInput::placeholder { color: var(--text-tertiary); }
    .mode-campaigns #userInput:focus { border-color: var(--campaign-accent); }

    #sendBtn {
      width: 42px; height: 42px; border-radius: var(--radius-md);
      background: var(--accent);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, opacity 0.2s;
      flex-shrink: 0;
    }
    #sendBtn:hover { transform: scale(1.05); }
    #sendBtn:active { transform: scale(0.95); }
    #sendBtn:disabled { opacity: 0.4; cursor: default; transform: none; }
    #sendBtn svg { width: 18px; height: 18px; fill: white; }
    .mode-campaigns #sendBtn { background: var(--campaign-accent); }

    /* ── MODE INDICATOR ── */
    .mode-indicator {
      text-align: center; padding: 8px 0;
      font-size: 11px; font-weight: 500;
      color: var(--text-tertiary);
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .mode-indicator .dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; margin-right: 6px;
      vertical-align: middle;
    }
    .mode-indicator .dot.ops { background: var(--accent); }
    .mode-indicator .dot.campaigns { background: var(--campaign-accent); }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .header { padding: 8px 12px; }
      .mode-tab { padding: 5px 10px; font-size: 11px; }
      .chat-container { padding: 12px; }
      .input-area { padding: 8px 12px 10px; }
      .header-title { font-size: 14px; }
      .tools-bar { padding: 6px 12px; }
    }
  </style>
</head>
<body>

  <!-- SPLASH -->
  <div id="splash">
    <div class="splash-icon">⚡</div>
    <div class="splash-text">MAGIC OPERATIONS</div>
  </div>

  <!-- GATE SCREEN -->
  <div id="gateScreen">
    <div class="gate-icon">🔒</div>
    <div class="gate-title">Magic Team Access</div>
    <div class="gate-subtitle">
      This tool requires a Magic ID. If you're part of the Magic team,
      open this page from your daemon shell.
    </div>
    <a class="gate-link" href="https://humans.magicid.cloud">
      Get Your Magic ID →
    </a>
  </div>

  <!-- MAIN APP -->
  <div id="app">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="header-logo">⚡</div>
        <div>
          <div class="header-title">Magic Ops</div>
          <div class="header-identity" id="identityLabel"></div>
        </div>
      </div>
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="ops" onclick="switchMode('ops')">Ops</button>
        <button class="mode-tab" data-mode="campaigns" onclick="switchMode('campaigns')">Campaigns</button>
      </div>
    </div>

    <!-- Tools navigation -->
    <div class="tools-bar">
      <a class="tool-link active-tool" id="toolChat" onclick="switchTool('chat')">💬 Chat</a>
      <a class="tool-link" id="toolVoice" href="voice-logger.html">🎙️ Voice Logger</a>
      <a class="tool-link" id="toolTrainer" href="trainer.html">🎓 Trainer</a>
    </div>

    <!-- Chat area -->
    <div class="chat-container" id="chatContainer"></div>

    <!-- Mode indicator -->
    <div class="mode-indicator" id="modeIndicator">
      <span class="dot ops"></span> Operations Intelligence
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-row">
        <textarea id="userInput" rows="1" placeholder="Ask about your merchants, campaigns, or pipeline..."></textarea>
        <button id="sendBtn" disabled>
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- WebDaemon + App Logic -->
  <script type="module">
    import { BrowserApp } from '$static/lib/js/BrowserApp.js'

    // ══════════════════════════════════════════
    // CONFIGURATION
    // ══════════════════════════════════════════

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwguD1A2772tUOqc36YW0pVQsttTZgAhVqV5UbEikjYNJUtlS0lI4Hpc01lqfaGZKqa/exec';

    // Daemon-to-team-member mapping
    // Add entries as team members get their daemon IDs
    const TEAM_MAP = {
      'thanasis.magicid.cloud': 'Thanasis'
      // 'maria.magicid.cloud': 'Maria',
    };

    // ══════════════════════════════════════════
    // STATE
    // ══════════════════════════════════════════

    let daemonId = null;
    let teamMemberName = null;
    let isAuthenticated = false;

    // Per-mode conversation histories
    let histories = {
      ops: [],
      campaigns: []
    };
    let currentMode = 'ops';
    let isWaiting = false;

    marked.setOptions({ breaks: true, gfm: true, headerIds: false, mangle: false });

    // ══════════════════════════════════════════
    // DAEMON IDENTITY
    // ══════════════════════════════════════════

    async function initDaemon() {
      try {
        const app = await BrowserApp.getInstance('magicops');
        const user = app.getParty();
        if (!user || user !== 'thanasis.magicid.cloud') return;
        daemonId = user;
        isAuthenticated = true;
        teamMemberName = TEAM_MAP[daemonId] || daemonId.split('.')[0];
        console.log('🔮 Authenticated: ' + daemonId + ' → ' + teamMemberName);
    } catch (e) {
      console.log('🔮 Daemon init error: ' + e.message);
    }
    }

    // ══════════════════════════════════════════
    // INIT
    // ══════════════════════════════════════════

    window.addEventListener('load', async function() {
      await initDaemon();

      setTimeout(function() {
        document.getElementById('splash').classList.add('hidden');

        if (!isAuthenticated) {
          document.getElementById('gateScreen').classList.add('visible');
          return;
        }

        // Show app
        document.getElementById('app').classList.add('visible');
        document.getElementById('identityLabel').textContent = daemonId;
        document.getElementById('sendBtn').disabled = false;

        // Show welcome message for Ops mode
        showOpsWelcome();
      }, 700);

      // Input handlers
      const input = document.getElementById('userInput');
      input.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
      });
      input.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });

      document.getElementById('sendBtn').addEventListener('click', sendMessage);
    });

    // ══════════════════════════════════════════
    // MODE SWITCHING
    // ══════════════════════════════════════════

    window.switchMode = function(mode) {
      if (mode === currentMode || isWaiting) return;
      currentMode = mode;

      // Update tab UI
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.mode-tab[data-mode="${mode}"]`).classList.add('active');

      // Update mode class on app for accent color switching
      const app = document.getElementById('app');
      app.classList.remove('mode-ops', 'mode-campaigns');
      app.classList.add('mode-' + mode);

      // Update mode indicator
      const indicator = document.getElementById('modeIndicator');
      if (mode === 'ops') {
        indicator.innerHTML = '<span class="dot ops"></span> Operations Intelligence';
      } else {
        indicator.innerHTML = '<span class="dot campaigns"></span> Campaign Manager';
      }

      // Update placeholder
      const input = document.getElementById('userInput');
      if (mode === 'ops') {
        input.placeholder = 'Ask about your merchants, campaigns, or pipeline...';
      } else {
        input.placeholder = 'Manage sequences, adjust copy, review performance...';
      }

      // Render the correct conversation history
      renderHistory();

      // If switching to a mode with no history, show welcome
      if (histories[mode].length === 0) {
        if (mode === 'ops') showOpsWelcome();
        else showCampaignWelcome();
      }
    };

    window.switchTool = function(tool) {
      // Chat tool is the current page — just update UI
      if (tool === 'chat') return;
    };

    // ══════════════════════════════════════════
    // WELCOME MESSAGES
    // ══════════════════════════════════════════

    function showOpsWelcome() {
      addMessage('assistant',
        `Hey ${teamMemberName} 👋\n\n` +
        'I\'m your CRM operations copilot. I have live access to the full pipeline, ' +
        'interactions, active merchants, and all intelligence tabs.\n\n' +
        'Are you on **sales** or **account management** today?'
      );
    }

    function showCampaignWelcome() {
      addMessage('assistant',
        `Campaign Manager ready, ${teamMemberName} 📊\n\n` +
        'I can see all outbound sequences, campaign performance, and category intelligence. ' +
        'What would you like to work on?\n\n' +
        '• **Review performance** — conversion rates, bounce rates, per-category breakdown\n' +
        '• **Manage sequences** — pause, resume, or cancel specific merchants\n' +
        '• **Adjust strategy** — modify targeting, timing, or content guidance\n' +
        '• **Draft content** — preview or refine email copy for any step'
      );
    }

    // ══════════════════════════════════════════
    // CHAT
    // ══════════════════════════════════════════

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text || isWaiting) return;

      // Add user message
      addMessage('user', text);
      histories[currentMode].push({ role: 'user', text: text });

      input.value = '';
      input.style.height = 'auto';
      setWaiting(true);

      try {
        const action = currentMode === 'ops' ? 'chat' : 'campaign';

        // Build history payload — for ops mode, include team member identity
        // so the backend can skip the "who are you" step
        const payload = {
          action: action,
          history: histories[currentMode],
          daemonId: daemonId,
          teamMember: teamMemberName
        };

        const response = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
        });

        // Apps Script redirects on POST — handle manually
        const data = await response.json();

        if (data.ok) {
          const cleaned = cleanResponse(data.text || data.reply || '');
          addMessage('assistant', cleaned);
          histories[currentMode].push({ role: 'assistant', text: cleaned });
        } else {
          addMessage('assistant', '⚠️ ' + (data.error || 'Something went wrong. Try again.'));
        }
      } catch (err) {
        console.error('Send error:', err);
        addMessage('assistant', '⚠️ Connection error. Check your network and try again.');
      }

      setWaiting(false);
    }

    // Make sendMessage available globally for button onclick
    window.sendMessage = sendMessage;

    // ══════════════════════════════════════════
    // RESPONSE CLEANING
    // ══════════════════════════════════════════

    function cleanResponse(text) {
      // Remove any session data blocks that might leak through
      text = text.replace(/```[\s]*\n?[\s]*(?:SESSION_ID\|)?GS-[\s\S]*?```/g, '');
      text = text.replace(/^(?:SESSION_ID\|)?GS-\d+\|.*$/gm, '');
      return text.trim();
    }

    // ══════════════════════════════════════════
    // UI HELPERS
    // ══════════════════════════════════════════

    function addMessage(role, text) {
      const container = document.getElementById('chatContainer');
      const wrapper = document.createElement('div');
      wrapper.className = 'message msg-' + role;

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';

      if (role === 'assistant') {
        bubble.innerHTML = marked.parse(text);
      } else {
        bubble.textContent = text;
      }

      wrapper.appendChild(bubble);
      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
    }

    function renderHistory() {
      const container = document.getElementById('chatContainer');
      container.innerHTML = '';

      const history = histories[currentMode];
      for (const msg of history) {
        const wrapper = document.createElement('div');
        wrapper.className = 'message msg-' + (msg.role === 'user' ? 'user' : 'assistant');

        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';

        if (msg.role === 'assistant') {
          bubble.innerHTML = marked.parse(msg.text);
        } else {
          bubble.textContent = msg.text;
        }

        wrapper.appendChild(bubble);
        container.appendChild(wrapper);
      }

      container.scrollTop = container.scrollHeight;
    }

    function setWaiting(waiting) {
      isWaiting = waiting;
      const btn = document.getElementById('sendBtn');
      const container = document.getElementById('chatContainer');

      btn.disabled = waiting;

      // Add/remove typing indicator
      const existing = container.querySelector('.typing');
      if (existing) existing.remove();

      if (waiting) {
        const typing = document.createElement('div');
        typing.className = 'message msg-assistant';
        typing.innerHTML = `
          <div class="msg-bubble" style="padding: 12px 18px; border: none; background: transparent;">
            <div class="typing">
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
            </div>
          </div>
        `;
        container.appendChild(typing);
        container.scrollTop = container.scrollHeight;
      }
    }
  </script>
</body>
</html>
